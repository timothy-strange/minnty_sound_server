<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minnty Sound Server</title>

  <style>
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #94a3b8;
      --bar-bg: #1f2937;
      --bar-fill: #22c55e;
      --select-bg: rgba(34, 197, 94, 0.18);
      --select-border: #22c55e;
      --focus-border: #38bdf8;
    }

    body {
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }


    /* Prevent selection/caret behaviors */
    body, .sink, .name, button {
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      caret-color: transparent;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .streaming-tag {
      grid-column: 2;
      display: none;
      height: 14px;
      border-radius: 7px;
      background: rgba(34, 197, 94, 0.22);
      border: 1px solid var(--select-border);
      color: var(--fg);
      font-size: 12px;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 36px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
    }

    .help-link {
      background: transparent;
      border: none;
      color: var(--fg);
      border-radius: 0;
      padding: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .help-link:hover {
      color: #dbeafe;
    }

    .outputs-title {
      margin: 0;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: 0.01em;
    }

    .outputs-subtitle {
      margin: 0;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      min-height: 1.25em;
    }

    .outputs-subtitle.hidden {
      visibility: hidden;
    }

    .outputs-empty {
      margin: 0;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      min-height: 1.25em;
      visibility: hidden;
    }

    .outputs-empty.open {
      visibility: visible;
    }

    .sink {
      display: grid;
      grid-template-columns: 380px 1fr 60px;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      outline: none;
    }

    .output-sink {
      grid-template-columns: 380px 1fr;
    }

    .name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--muted);
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid transparent;
    }

    /* Hover = affordance only */
    .sink:hover .name {
      color: var(--fg);
    }

    /* Focus = keyboard location */
    .sink:focus-visible .name {
      border-color: var(--focus-border);
    }

    /* Selected = explicit choice */
    .sink.selected .name {
      color: var(--fg);
      background: var(--select-bg);
      border-color: var(--select-border);
    }

    .meter {
      grid-column: 2;
      height: 14px;
      background: var(--bar-bg);
      border-radius: 7px;
      overflow: hidden;
    }

    .meter.hidden {
      display: none;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: var(--bar-fill);
      transition: width 60ms linear;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .test-panel {
      display: none;
      margin-top: 6px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 8px;
      padding: 10px;
      background: rgba(15, 23, 42, 0.35);
    }

    .test-panel.open {
      display: block;
    }

    .test-title {
      margin: 0 0 8px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .test-buttons {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .test-delay-btn {
      background: #1f2937;
      color: var(--fg);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .layout {
      flex: 1;
      min-height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding-top: 24px;
    }

    .deactivated-panel {
      display: none;
      border: 1px solid rgba(248, 113, 113, 0.45);
      background: rgba(127, 29, 29, 0.35);
      border-radius: 8px;
      padding: 12px;
      color: #fecaca;
    }

    .deactivated-panel.open {
      display: block;
    }

    .deactivated-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .deactivated-body {
      font-size: 13px;
      color: #fecaca;
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .danger {
      background: #ef4444;
      color: #1f0a0a;
    }

    button {
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      background: #22c55e;
      color: #022c22;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    button:focus-visible {
      outline: 2px solid var(--focus-border);
      outline-offset: 2px;
    }

    .help-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(2, 6, 23, 0.72);
    }

    .help-modal.open {
      display: flex;
    }

    .help-panel {
      width: min(760px, 96vw);
      max-height: 80vh;
      overflow: auto;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: #111827;
      padding: 16px;
      box-shadow: 0 20px 50px rgba(2, 6, 23, 0.6);
    }

    .help-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .help-title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .help-close {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
    }

    .help-content {
      color: var(--fg);
      line-height: 1.45;
      font-size: 14px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1 id="pageTitle"></h1>
    <button id="helpBtn" class="help-link"></button>
  </div>

  <div class="layout">
    <div id="deactivatedPanel" class="deactivated-panel" role="status" aria-live="polite">
      <div id="deactivatedTitle" class="deactivated-title"></div>
      <div id="deactivatedBody" class="deactivated-body"></div>
    </div>

    <div class="row" id="outputsRow">
      <h2 id="outputsTitle" class="outputs-title"></h2>
      <p id="outputsSubtitle" class="outputs-subtitle"></p>
      <p id="outputsEmpty" class="outputs-empty"></p>
      <div id="sinks"></div>
      <div class="actions">
        <button id="startBtn" disabled></button>
      </div>
      <div id="networkTestPanel" class="test-panel">
        <h3 id="networkTestTitle" class="test-title"></h3>
        <div class="test-buttons">
          <button id="gapBtn50" class="test-delay-btn"></button>
          <button id="gapBtn100" class="test-delay-btn"></button>
          <button id="gapBtn200" class="test-delay-btn"></button>
          <button id="gapBtn300" class="test-delay-btn"></button>
          <button id="gapBtn500" class="test-delay-btn"></button>
          <button id="gapBtn700" class="test-delay-btn"></button>
          <button id="gapBtn1000" class="test-delay-btn"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="helpModal" class="help-modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="help-panel">
      <div class="help-title-row">
        <h2 id="helpTitle" class="help-title"></h2>
        <button id="helpClose" class="help-close"></button>
      </div>
      <div id="helpContent" class="help-content"></div>
    </div>
  </div>

  <script>
    const container = document.getElementById("sinks");
    const startBtn = document.getElementById("startBtn");
    const helpBtn = document.getElementById("helpBtn");
    const helpModal = document.getElementById("helpModal");
    const helpClose = document.getElementById("helpClose");
    const helpTitle = document.getElementById("helpTitle");
    const helpContent = document.getElementById("helpContent");
    const pageTitle = document.getElementById("pageTitle");
    const outputsTitle = document.getElementById("outputsTitle");
    const deactivatedPanel = document.getElementById("deactivatedPanel");
    const deactivatedTitle = document.getElementById("deactivatedTitle");
    const deactivatedBody = document.getElementById("deactivatedBody");
    const outputsRow = document.getElementById("outputsRow");
    const outputsSubtitle = document.getElementById("outputsSubtitle");
    const outputsEmpty = document.getElementById("outputsEmpty");
    const networkTestPanel = document.getElementById("networkTestPanel");
    const networkTestTitle = document.getElementById("networkTestTitle");
    const gapBtn50 = document.getElementById("gapBtn50");
    const gapBtn100 = document.getElementById("gapBtn100");
    const gapBtn200 = document.getElementById("gapBtn200");
    const gapBtn300 = document.getElementById("gapBtn300");
    const gapBtn500 = document.getElementById("gapBtn500");
    const gapBtn700 = document.getElementById("gapBtn700");
    const gapBtn1000 = document.getElementById("gapBtn1000");
    const rows = [];
    const rowByName = new Map();
    let strings = {};
    let features = { net_impairment_ui: false };
    let selectedSink = null;
    let selectedSinkIsActive = false;
    let isStreaming = false;
    let isDeactivated = false;
    let deactivationReason = null;
    let activeOutputCount = 0;
    let totalOutputCount = 0;
    let statusFailureCount = 0;
    const OFFLINE_THRESHOLD = 3;
    let lastFocusedBeforeHelp = null;
    const tabId = `tab-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    const activeTabStorageKey = "minnty_active_tab";
    const tabChannelName = "minnty_ui_tabs";
    let tabChannel = null;
    let levelsTimer = null;
    let statusTimer = null;
    const simulateNoOutputs = new URLSearchParams(window.location.search).get("simulate_no_outputs") === "1";
    const ACTIVE_OUTPUT_THRESHOLD = 0.01;

    function t(key, fallback = "") {
      const parts = key.split(".");
      let node = strings;
      for (const part of parts) {
        if (!node || typeof node !== "object" || !(part in node)) {
          return fallback;
        }
        node = node[part];
      }
      return typeof node === "string" ? node : fallback;
    }

    function openHelp() {
      lastFocusedBeforeHelp = document.activeElement;
      helpModal.classList.add("open");
      helpClose.focus();
    }

    function closeHelp() {
      helpModal.classList.remove("open");
      if (lastFocusedBeforeHelp && typeof lastFocusedBeforeHelp.focus === "function") {
        lastFocusedBeforeHelp.focus();
      } else {
        helpBtn.focus();
      }
    }

    function trapHelpFocus(e) {
      if (e.key !== "Tab" || !helpModal.classList.contains("open")) return;

      const focusables = helpModal.querySelectorAll("button, [href], [tabindex]:not([tabindex='-1'])");
      if (!focusables.length) return;

      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      const active = document.activeElement;

      if (e.shiftKey && active === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && active === last) {
        e.preventDefault();
        first.focus();
      }
    }

    async function loadI18n() {
      try {
        const res = await fetch("/api/i18n", { cache: "no-store" });
        if (!res.ok) return;
        const payload = await res.json();
        strings = payload.strings || {};
      } catch (_) {
        strings = {};
      }
    }

    async function loadFeatures() {
      try {
        const res = await fetch("/api/features", { cache: "no-store" });
        if (!res.ok) return;
        const payload = await res.json();
        features = {
          net_impairment_ui: !!payload.net_impairment_ui,
        };
      } catch (_) {
        features = { net_impairment_ui: false };
      }
    }

    function applyFeatureVisibility() {
      if (features.net_impairment_ui) {
        networkTestPanel.classList.add("open");
      } else {
        networkTestPanel.classList.remove("open");
      }
    }

    function applyLocalizedStrings() {
      const title = t("web.title");
      document.title = title;
      pageTitle.textContent = title;
      helpBtn.textContent = t("web.buttons.help");
      helpTitle.textContent = t("web.help.title");
      helpClose.textContent = t("web.help.close");
      outputsTitle.textContent = t("web.outputs.title");
      outputsEmpty.textContent = t("web.outputs.no_outputs");
      networkTestTitle.textContent = t("web.testing.title");
      gapBtn50.textContent = t("web.testing.delay_50");
      gapBtn100.textContent = t("web.testing.delay_100");
      gapBtn200.textContent = t("web.testing.delay_200");
      gapBtn300.textContent = t("web.testing.delay_300");
      gapBtn500.textContent = t("web.testing.delay_500");
      gapBtn700.textContent = t("web.testing.delay_700");
      gapBtn1000.textContent = t("web.testing.delay_1000");
      deactivatedTitle.textContent = t("web.tab.deactivated_title");
      setDeactivatedMessage(deactivationReason || "tab_takeover");

      const helpLines = strings?.web?.help?.lines;
      if (Array.isArray(helpLines) && helpLines.length > 0) {
        helpContent.textContent = helpLines.join("\n\n");
      } else {
        helpContent.textContent = "";
      }

      updateStartButton();
      updateOutputsHint();
      for (const row of rows) {
        row.streamingTag.textContent = t("web.labels.streaming");
      }
      applyFeatureVisibility();
    }

    function updateOutputsHint() {
      if (isStreaming) {
        outputsSubtitle.classList.add("hidden");
        outputsEmpty.classList.remove("open");
        return;
      }

      outputsSubtitle.classList.remove("hidden");

      if (totalOutputCount === 0) {
        outputsSubtitle.textContent = "";
        outputsEmpty.classList.add("open");
        return;
      }

      outputsEmpty.classList.remove("open");

      if (selectedSink && selectedSinkIsActive) {
        outputsSubtitle.textContent = t("web.outputs.hint_click_start");
      } else if (selectedSink && activeOutputCount === 0) {
        outputsSubtitle.textContent = t("web.outputs.hint_selected_inactive_play_audio");
      } else if (selectedSink) {
        outputsSubtitle.textContent = t("web.outputs.hint_selected_inactive");
      } else if (activeOutputCount > 0) {
        outputsSubtitle.textContent = t("web.outputs.hint_select_output");
      } else {
        outputsSubtitle.textContent = t("web.outputs.hint_play_audio");
      }
    }

    function setOutputRowsVisible(visible) {
      for (const row of rows) {
        row.row.style.display = visible ? "grid" : "none";
      }
    }

    async function triggerOneShotGap(delayMs) {
      if (!features.net_impairment_ui) return;
      if (isDeactivated) return;

      await fetch("/api/test/network-gap-once", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ delay_ms: delayMs }),
      });
    }

    function setDeactivatedMessage(reason) {
      if (reason === "process_exited") {
        deactivatedBody.textContent = t("web.tab.deactivated_body_process_exited");
        return;
      }

      deactivatedBody.textContent = t("web.tab.deactivated_body_tab_takeover");
    }

    function setDeactivated(reason) {
      if (isDeactivated) {
        return;
      }

      deactivationReason = reason;
      isDeactivated = true;
      isStreaming = false;
      setDeactivatedMessage(reason);
      deactivatedPanel.classList.add("open");
      outputsRow.style.display = "none";
      helpModal.classList.remove("open");
      if (levelsTimer !== null) {
        clearInterval(levelsTimer);
        levelsTimer = null;
      }
      if (statusTimer !== null) {
        clearInterval(statusTimer);
        statusTimer = null;
      }
      updateStartButton();
      updateStreamingUi();
    }

    function claimActiveTab() {
      try {
        localStorage.setItem(activeTabStorageKey, tabId);
      } catch (_) { }

      if (tabChannel) {
        tabChannel.postMessage({ type: "activate", tabId });
      }
    }

    function initTabCoordination() {
      if (typeof BroadcastChannel !== "undefined") {
        tabChannel = new BroadcastChannel(tabChannelName);
        tabChannel.addEventListener("message", (event) => {
          const msg = event.data;
          if (!msg || msg.type !== "activate") return;
          if (msg.tabId !== tabId) {
            setDeactivated("tab_takeover");
          }
        });
      }

      window.addEventListener("storage", (event) => {
        if (event.key !== activeTabStorageKey) return;
        if (event.newValue && event.newValue !== tabId) {
          setDeactivated("tab_takeover");
        }
      });

      claimActiveTab();
    }

    function resetSelection() {
      selectedSink = null;
      selectedSinkIsActive = false;
      for (const r of rows) r.row.classList.remove("selected");
      updateStartButton();
      updateStreamingUi();
      updateOutputsHint();
    }

    function updateStartButton() {
      if (isDeactivated) {
        startBtn.textContent = t("web.buttons.start_stream");
        startBtn.disabled = true;
        return;
      }

      if (totalOutputCount === 0) {
        startBtn.textContent = t("web.buttons.start_stream");
        startBtn.disabled = true;
        return;
      }

      if (isStreaming) {
        startBtn.textContent = t("web.buttons.stop_stream");
        startBtn.disabled = false;
        return;
      }

      startBtn.textContent = t("web.buttons.start_stream");
      startBtn.disabled = !selectedSink;
    }

    function selectSink(name, force = false) {
      if (isDeactivated && !force) return;
      if (isStreaming && !force) return;
      if (selectedSink === name) return;

      for (const r of rows) r.row.classList.remove("selected");

      const r = rowByName.get(name);
      if (!r) return;

      r.row.classList.add("selected");
      selectedSink = name;
      updateStartButton();
      updateOutputsHint();
    }

    function consumeLeftRight(e) {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault();
        e.stopPropagation();
      }
    }

    function getRow(name) {
      if (rowByName.has(name)) return rowByName.get(name);

      const row = document.createElement("div");
      row.className = "sink";
      row.classList.add("output-sink");
      row.tabIndex = 0;

      const label = document.createElement("div");
      label.className = "name";
      label.textContent = name;

      const meter = document.createElement("div");
      meter.className = "meter";

      const fill = document.createElement("div");
      fill.className = "fill";
      meter.appendChild(fill);

      const streamingTag = document.createElement("div");
      streamingTag.className = "streaming-tag";
      streamingTag.textContent = t("web.labels.streaming");

      row.append(label, meter, streamingTag);
      container.appendChild(row);

      row.addEventListener("click", () => selectSink(name));

      row.addEventListener("keydown", (e) => {
        consumeLeftRight(e);

        const idx = rows.findIndex(r => r.row === row);

        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          selectSink(name);
          return;
        }

        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (idx < rows.length - 1) rows[idx + 1].row.focus();
          else startBtn.focus();
          return;
        }

        if (e.key === "ArrowUp") {
          e.preventDefault();
          if (idx > 0) rows[idx - 1].row.focus();
          return;
        }
      });

      const obj = { row, meter, fill, streamingTag };
      rows.push(obj);
      rowByName.set(name, obj);
      return obj;
    }

    function updateStreamingUi() {
      for (const r of rows) {
        if (isStreaming) {
          r.meter.classList.add("hidden");
          const active = r.row.classList.contains("selected");
          r.streamingTag.style.display = active ? "flex" : "none";
        } else {
          r.meter.classList.remove("hidden");
          r.streamingTag.style.display = "none";
        }
      }
    }

    startBtn.addEventListener("keydown", (e) => {
      consumeLeftRight(e);

      if ((e.key === "Enter" || e.key === " ") && !startBtn.disabled) {
        e.preventDefault();
        startBtn.click();
        return;
      }

      if (e.key === "ArrowUp" && rows.length > 0) {
        e.preventDefault();
        rows[rows.length - 1].row.focus();
        return;
      }

      if (e.key === "ArrowDown") {
        e.preventDefault(); // keep focus on button
        return;
      }
    });

    // Also consume Left/Right anywhere to avoid losing focus/scrolling quirks.
    document.addEventListener("keydown", consumeLeftRight, { capture: true });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && helpModal.classList.contains("open")) {
        e.preventDefault();
        closeHelp();
      }
    });
    helpModal.addEventListener("keydown", trapHelpFocus);

    helpBtn.addEventListener("click", openHelp);
    helpClose.addEventListener("click", closeHelp);
    helpModal.addEventListener("click", (e) => {
      if (e.target === helpModal) {
        closeHelp();
      }
    });

    gapBtn50.addEventListener("click", () => triggerOneShotGap(50));
    gapBtn100.addEventListener("click", () => triggerOneShotGap(100));
    gapBtn200.addEventListener("click", () => triggerOneShotGap(200));
    gapBtn300.addEventListener("click", () => triggerOneShotGap(300));
    gapBtn500.addEventListener("click", () => triggerOneShotGap(500));
    gapBtn700.addEventListener("click", () => triggerOneShotGap(700));
    gapBtn1000.addEventListener("click", () => triggerOneShotGap(1000));

    async function update() {
      if (isDeactivated) return;
      try {
        const res = await fetch("/api/levels", { cache: "no-store" });
        if (!res.ok) return;

        const fetchedData = await res.json();
        const data = simulateNoOutputs ? [] : fetchedData;
        totalOutputCount = data.length;
        activeOutputCount = data.filter((s) => s.peak > ACTIVE_OUTPUT_THRESHOLD).length;
        selectedSinkIsActive = selectedSink
          ? data.some((s) => s.name === selectedSink && s.peak > ACTIVE_OUTPUT_THRESHOLD)
          : false;
        setOutputRowsVisible(totalOutputCount > 0);
        updateStartButton();
        updateOutputsHint();

        for (const s of data) {
          const row = getRow(s.name);
          row.row.style.display = "grid";
          if (!isStreaming) {
            const pct = Math.max(0, Math.min(1, s.peak)) * 100;
            row.fill.style.width = pct.toFixed(1) + "%";
          }
        }
      } catch (_) { }
    }

    async function refreshStatus() {
      if (isDeactivated) return;
      try {
        const res = await fetch("/api/stream/status", { cache: "no-store" });
        if (!res.ok) throw new Error("status request failed");
        const data = await res.json();
        statusFailureCount = 0;
        isStreaming = !!data.running;
        if (data.sink) {
          selectSink(data.sink, true);
        }
        updateStartButton();
        updateStreamingUi();
        updateOutputsHint();
      } catch (_) {
        statusFailureCount += 1;
        if (statusFailureCount >= OFFLINE_THRESHOLD) {
          setDeactivated("process_exited");
        }
      }
    }

    startBtn.addEventListener("click", async () => {
      if (isDeactivated) return;
      if (isStreaming) {
        await fetch("/api/stream/stop", { method: "POST" });
      } else if (selectedSink) {
        await fetch("/api/stream/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sink: selectedSink }),
        });
      }
      await refreshStatus();
      updateStreamingUi();
      updateOutputsHint();
    });

    // Ensure reload starts with no selection and disabled button.
    async function init() {
      await loadI18n();
      await loadFeatures();
      initTabCoordination();
      applyLocalizedStrings();
      resetSelection();
      updateOutputsHint();

      levelsTimer = setInterval(update, 50);
      statusTimer = setInterval(refreshStatus, 1000);
      update();
      refreshStatus();
    }

    init();

  </script>
</body>

</html>
