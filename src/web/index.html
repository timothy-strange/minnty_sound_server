<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minnty Sound Server</title>

  <style>
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #94a3b8;
      --bar-bg: #1f2937;
      --bar-fill: #22c55e;
      --select-bg: rgba(34, 197, 94, 0.18);
      --select-border: #22c55e;
      --focus-border: #38bdf8;
    }

    body {
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }


    /* Prevent selection/caret behaviors */
    body, .sink, .name, .value, button {
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      caret-color: transparent;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 600;
    }

    .hint {
      margin: 0;
      color: var(--fg);
      font-size: 18px;
      text-align: center;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .header-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hint-row {
      display: flex;
      justify-content: center;
      margin-top: 12px;
      margin-bottom: 50px;
    }

    .sink {
      display: grid;
      grid-template-columns: 380px 1fr 60px;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      outline: none;
    }

    .name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--muted);
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid transparent;
    }

    /* Hover = affordance only */
    .sink:hover .name {
      color: var(--fg);
    }

    /* Focus = keyboard location */
    .sink:focus-visible .name {
      border-color: var(--focus-border);
    }

    /* Selected = explicit choice */
    .sink.selected .name {
      color: var(--fg);
      background: var(--select-bg);
      border-color: var(--select-border);
    }

    .meter {
      height: 14px;
      background: var(--bar-bg);
      border-radius: 7px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: var(--bar-fill);
      transition: width 60ms linear;
    }

    .value {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .layout {
      flex: 1;
      min-height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      gap: 50px;
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .danger {
      background: #ef4444;
      color: #1f0a0a;
    }

    button {
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      background: #22c55e;
      color: #022c22;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    button:focus-visible {
      outline: 2px solid var(--focus-border);
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="header-text">
      <h1>Minnty Sound Server</h1>
    </div>
    <button id="shutdownBtn" class="danger">Exit</button>
  </div>

  <div class="hint-row">
    <p class="hint">Select output then click "Start Server"</p>
  </div>

  <div class="layout">
    <div class="row" id="outputsRow">
      <div id="sinks"></div>
      <div class="actions">
        <button id="startBtn" disabled>Start Server</button>
      </div>
    </div>

    <div class="row" id="monitorRow">
      <div class="sink">
        <div class="name">Monitor Level</div>
        <div class="meter"><div class="fill" id="monitorFill"></div></div>
        <div class="value" id="monitorValue">0.00</div>
      </div>
      <div class="actions">
        <button id="monitorBtn" disabled>Monitor Stream</button>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById("sinks");
    const startBtn = document.getElementById("startBtn");
    const monitorBtn = document.getElementById("monitorBtn");
    const shutdownBtn = document.getElementById("shutdownBtn");
    const monitorFill = document.getElementById("monitorFill");
    const monitorValue = document.getElementById("monitorValue");
    const rows = [];
    const rowByName = new Map();
    let selectedSink = null;
    let isStreaming = false;
    let isMonitoring = false;

    function resetSelection() {
      selectedSink = null;
      for (const r of rows) r.row.classList.remove("selected");
      updateStartButton();
      updateMonitorButton();
    }

    function updateStartButton() {
      if (isStreaming) {
        startBtn.textContent = "Stop Server";
        startBtn.disabled = false;
        return;
      }

      startBtn.textContent = "Start Server";
      startBtn.disabled = !selectedSink;
    }

    function updateMonitorButton() {
      if (!isStreaming) {
        monitorBtn.textContent = "Monitor Stream";
        monitorBtn.disabled = true;
        return;
      }

      monitorBtn.textContent = isMonitoring ? "Stop Monitor" : "Monitor Stream";
      monitorBtn.disabled = false;
    }

    function selectSink(name) {
      if (selectedSink === name) return;

      for (const r of rows) r.row.classList.remove("selected");

      const r = rowByName.get(name);
      if (!r) return;

      r.row.classList.add("selected");
      selectedSink = name;
      updateStartButton();
    }

    function consumeLeftRight(e) {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault();
        e.stopPropagation();
      }
    }

    function getRow(name) {
      if (rowByName.has(name)) return rowByName.get(name);

      const row = document.createElement("div");
      row.className = "sink";
      row.tabIndex = 0;

      const label = document.createElement("div");
      label.className = "name";
      label.textContent = name;

      const meter = document.createElement("div");
      meter.className = "meter";

      const fill = document.createElement("div");
      fill.className = "fill";
      meter.appendChild(fill);

      const value = document.createElement("div");
      value.className = "value";
      value.textContent = "0.00";

      row.append(label, meter, value);
      container.appendChild(row);

      row.addEventListener("click", () => selectSink(name));

      row.addEventListener("keydown", (e) => {
        consumeLeftRight(e);

        const idx = rows.findIndex(r => r.row === row);

        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          selectSink(name);
          return;
        }

        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (idx < rows.length - 1) rows[idx + 1].row.focus();
          else startBtn.focus();
          return;
        }

        if (e.key === "ArrowUp") {
          e.preventDefault();
          if (idx > 0) rows[idx - 1].row.focus();
          return;
        }
      });

      const obj = { row, fill, value };
      rows.push(obj);
      rowByName.set(name, obj);
      return obj;
    }

    startBtn.addEventListener("keydown", (e) => {
      consumeLeftRight(e);

      if ((e.key === "Enter" || e.key === " ") && !startBtn.disabled) {
        e.preventDefault();
        startBtn.click();
        return;
      }

      if (e.key === "ArrowUp" && rows.length > 0) {
        e.preventDefault();
        rows[rows.length - 1].row.focus();
        return;
      }

      if (e.key === "ArrowDown") {
        e.preventDefault(); // keep focus on button
        return;
      }
    });

    // Also consume Left/Right anywhere to avoid losing focus/scrolling quirks.
    document.addEventListener("keydown", consumeLeftRight, { capture: true });

    async function update() {
      try {
        const res = await fetch("/api/levels", { cache: "no-store" });
        if (!res.ok) return;

        const data = await res.json();
        for (const s of data) {
          const row = getRow(s.name);
          const pct = Math.max(0, Math.min(1, s.peak)) * 100;
          row.fill.style.width = pct.toFixed(1) + "%";
          row.value.textContent = s.peak.toFixed(2);
        }
      } catch (_) { }
    }

    async function refreshStatus() {
      try {
        const res = await fetch("/api/stream/status", { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        isStreaming = !!data.running;
        if (data.sink) {
          selectSink(data.sink);
        }
        updateStartButton();
        if (!isStreaming) {
          isMonitoring = false;
        }
        updateMonitorButton();
      } catch (_) { }
    }

    async function refreshMonitor() {
      try {
        const res = await fetch("/api/monitor/level", { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        isMonitoring = !!data.active;
        const pct = Math.max(0, Math.min(1, data.peak || 0)) * 100;
        monitorFill.style.width = pct.toFixed(1) + "%";
        monitorValue.textContent = (data.peak || 0).toFixed(2);
        updateMonitorButton();
      } catch (_) { }
    }

    startBtn.addEventListener("click", async () => {
      if (isStreaming) {
        await fetch("/api/stream/stop", { method: "POST" });
      } else if (selectedSink) {
        await fetch("/api/stream/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sink: selectedSink }),
        });
      }
      await refreshStatus();
      await refreshMonitor();
    });

    monitorBtn.addEventListener("click", async () => {
      if (!isStreaming) return;
      if (isMonitoring) {
        await fetch("/api/monitor/stop", { method: "POST" });
      } else {
        await fetch("/api/monitor/start", { method: "POST" });
      }
      await refreshMonitor();
    });

    shutdownBtn.addEventListener("click", async () => {
      await fetch("/api/shutdown", { method: "POST" });
      document.body.innerHTML = "<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;\"><h1>Server has shut down.</h1></div>";
      clearInterval(levelsTimer);
      clearInterval(statusTimer);
      clearInterval(monitorTimer);
    });

    // Ensure reload starts with no selection and disabled button.
    resetSelection();

    const levelsTimer = setInterval(update, 50);
    const statusTimer = setInterval(refreshStatus, 1000);
    const monitorTimer = setInterval(refreshMonitor, 100);
    update();
    refreshStatus();
    refreshMonitor();

  </script>
</body>

</html>
