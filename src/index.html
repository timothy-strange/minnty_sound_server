<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Minnty Sound Server</title>
        <style>
            body {
                font-family: sans-serif;
                background: #121212;
                color: #e0e0e0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
            }
            .container {
                text-align: center;
                padding: 2rem;
                border: 1px solid #333;
                border-radius: 8px;
                background: #1e1e1e;
            }
            h1 { color: #4CAF50; }
            .status { margin-top: 1rem; color: #888; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Minnty Sound Server</h1>
            
            <div style="margin-bottom: 20px;">
                <label for="device-select">Select Audio Output:</label><br>
                <select id="device-select" onchange="checkSelection()" style="padding: 8px; margin-top: 5px; width: 100%; background: #333; color: white; border: 1px solid #555;">
                    <option value="">-- Please choose an output --</option>
                </select>
            </div>

            <p id="status-text" style="color: #ff9800;">Please select an output device</p>
            
            <button id="toggle-btn" onclick="toggleServer()" disabled style="padding: 10px 20px; font-size: 16px; cursor: not-allowed; background: #555; color: white; border: none; border-radius: 4px;">
                Start Server
            </button>
        </div>

        <script>
            async function loadDevices() {
                const response = await fetch('/devices');
                const devices = await response.json();
                const select = document.getElementById('device-select');
                
                devices.forEach(dev => {
                    const opt = document.createElement('option');
                    opt.value = dev;
                    opt.innerHTML = dev;
                    select.appendChild(opt);
                });
            }

            function checkSelection() {
                const select = document.getElementById('device-select');
                const btn = document.getElementById('toggle-btn');
                const status = document.getElementById('status-text');

                if (select.value !== "") {
                    btn.disabled = false;
                    btn.style.cursor = "pointer";
                    btn.style.background = "#4CAF50";
                    status.innerText = "Ready to start";
                    status.style.color = "#e0e0e0";
                } else {
                    btn.disabled = true;
                    btn.style.cursor = "not-allowed";
                    btn.style.background = "#555";
                    status.innerText = "Please select an output device";
                    status.style.color = "#ff9800";
                }
            }

            async function toggleServer() {
                const response = await fetch('/toggle', { method: 'POST' });
                const data = await response.json();
                updateUI(data.running);
            }

            function updateUI(isRunning) {
                const btn = document.getElementById('toggle-btn');
                const status = document.getElementById('status-text');
                const select = document.getElementById('device-select');
                
                if (isRunning) {
                    btn.innerText = "Stop Server";
                    btn.style.background = "#f44336";
                    status.innerText = "Streaming from: " + select.value;
                    status.style.color = "#4CAF50";
                    select.disabled = true; // Lock selection while running
                } else {
                    btn.innerText = "Start Server";
                    btn.style.background = "#4CAF50";
                    status.innerText = "Ready to start";
                    status.style.color = "#e0e0e0";
                    select.disabled = false;
                }
            }

            // Initialize
            loadDevices();
        </script>
    </body>
</html>
