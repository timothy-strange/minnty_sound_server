name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev libpulse-dev libdbus-1-dev libxdo-dev
      - run: cargo fmt --check
      - run: cargo test

  windows:
    name: Windows check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
