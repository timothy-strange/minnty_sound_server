name: AppImage

on:
  workflow_dispatch:

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install base tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git wget

      - uses: actions/checkout@v5

      - name: Install build and packaging dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            desktop-file-utils \
            file \
            libdbus-1-dev \
            libgtk-3-dev \
            libpulse-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Download AppImage tooling
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -O linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION="manual-${GITHUB_SHA::7}"
          fi
          mkdir -p dist AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/release/minnty_sound_server AppDir/usr/bin/
          cp packaging/minnty-sound-server.desktop AppDir/usr/share/applications/
          cp packaging/minnty-sound-server.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          PATH="$PWD:$PATH" ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file packaging/minnty-sound-server.desktop \
            --icon-file packaging/minnty-sound-server.svg \
            --executable target/release/minnty_sound_server \
            --plugin gtk \
            --output appimage
          mv ./*.AppImage "dist/minnty-sound-server-${VERSION}-linux-x86_64.AppImage"

      - name: Inspect bundled binary linkage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x dist/*.AppImage
          dist/*.AppImage --appimage-extract >/dev/null
          ldd squashfs-root/usr/bin/minnty_sound_server | tee dist/appimage-ldd-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-artifacts
          path: |
            dist/*.AppImage
            dist/appimage-ldd-report.txt
