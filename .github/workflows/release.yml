name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev libpulse-dev libdbus-1-dev libxdo-dev
      - name: Install Linux packaging tools
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
      - name: Build release binary
        run: cargo build --release
      - name: Package DEB
        run: cargo deb --no-build
      - name: Package RPM
        run: cargo generate-rpm
      - name: Package AppImage
        run: |
          mkdir -p dist AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/release/minnty_sound_server AppDir/usr/bin/
          cp packaging/minnty-sound-server.desktop AppDir/usr/share/applications/
          cp packaging/minnty-sound-server.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          cp packaging/minnty-sound-server.desktop AppDir/
          cp packaging/minnty-sound-server.svg AppDir/minnty-sound-server.svg
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/minnty_sound_server" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "dist/minnty-sound-server-${{ github.ref_name }}-linux-x86_64.AppImage"
      - name: Collect Linux packages
        run: |
          mkdir -p dist
          cp target/debian/*.deb "dist/minnty-sound-server-${{ github.ref_name }}-linux-x86_64.deb"
          cp target/generate-rpm/*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Download Visual C++ Redistributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "dist/vc_redist.x64.exe"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging/windows/minnty-sound-server.iss" "/DArtifactVersion=${{ github.ref_name }}" "/DRepoRoot=${{ github.workspace }}"
          Compress-Archive -Path "dist/minnty-sound-server-${{ github.ref_name }}-windows-x86_64-setup.exe" -DestinationPath "dist/minnty-sound-server-${{ github.ref_name }}-windows-x86_64-setup.zip"
          Remove-Item "dist/minnty-sound-server-${{ github.ref_name }}-windows-x86_64-setup.exe"
          Remove-Item "dist/vc_redist.x64.exe"
      - name: Package portable zip
        shell: pwsh
        run: |
          $stage = "dist/portable"
          New-Item -ItemType Directory -Force -Path $stage
          Copy-Item "target/release/minnty_sound_server.exe" $stage
          Copy-Item "README.md" $stage
          Copy-Item "LICENSE" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/minnty-sound-server-${{ github.ref_name }}-windows-x86_64-portable.zip"
          Remove-Item -Recurse -Force $stage
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*.zip

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "Minnty Sound Server ${{ github.ref_name }}" --generate-notes
