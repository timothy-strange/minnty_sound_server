name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Download Visual C++ Redistributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "dist/vc_redist.x64.exe"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging/windows/minnty-sound-server.iss" "/DArtifactVersion=${{ github.ref_name }}" "/DRepoRoot=${{ github.workspace }}"
          Compress-Archive -Path "dist/minnty-sound-server-${{ github.ref_name }}-windows-x86_64-setup.exe" -DestinationPath "dist/minnty-sound-server-${{ github.ref_name }}-windows-x86_64-setup.zip"
          Remove-Item "dist/minnty-sound-server-${{ github.ref_name }}-windows-x86_64-setup.exe"
          Remove-Item "dist/vc_redist.x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*-setup.zip

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "Minnty Sound Server ${{ github.ref_name }}" --generate-notes
