name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev libpulse-dev libdbus-1-dev rpm wget file
      - name: Build release binary
        run: cargo build --release
      - name: Package tarball
        run: |
          mkdir -p dist tarball/minnty-sound-server-${{ github.ref_name }}-linux-x86_64
          cp target/release/minnty_sound_server tarball/minnty-sound-server-${{ github.ref_name }}-linux-x86_64/
          cp LICENSE README.md tarball/minnty-sound-server-${{ github.ref_name }}-linux-x86_64/
          tar -C tarball -czf dist/minnty-sound-server-${{ github.ref_name }}-linux-x86_64.tar.gz minnty-sound-server-${{ github.ref_name }}-linux-x86_64
      - name: Package RPM
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm -o dist/
      - name: Package deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --output dist/minnty-sound-server-${{ github.ref_name }}-linux-x86_64.deb
      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/release/minnty_sound_server AppDir/usr/bin/
          cp packaging/minnty-sound-server.desktop AppDir/usr/share/applications/
          cp packaging/minnty-sound-server.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          cp packaging/minnty-sound-server.svg AppDir/minnty-sound-server.svg
          cat > AppDir/AppRun <<'APP_RUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/minnty_sound_server" "$@"
          APP_RUN
          chmod +x AppDir/AppRun
          wget -O linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv Minnty_Sound_Server-x86_64.AppImage dist/minnty-sound-server-${{ github.ref_name }}-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Package Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, package
          Copy-Item target/release/minnty_sound_server.exe package/
          Copy-Item LICENSE package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath dist/minnty-sound-server-${{ github.ref_name }}-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "Minnty Sound Server ${{ github.ref_name }}" --generate-notes
