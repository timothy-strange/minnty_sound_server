name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev libpulse-dev libdbus-1-dev libxdo-dev
      - name: Install Linux packaging tools
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
      - name: Build release binary
        run: cargo build --release
      - name: Package DEB
        run: cargo deb --no-build
      - name: Package RPM
        run: cargo generate-rpm
      - name: Package Linux tarball
        run: |
          mkdir -p dist "dist/minnty-sound-server-${{ github.ref_name }}-linux-x86_64"
          cp target/release/minnty_sound_server "dist/minnty-sound-server-${{ github.ref_name }}-linux-x86_64/"
          cp README.md LICENSE "dist/minnty-sound-server-${{ github.ref_name }}-linux-x86_64/"
          tar -czf "dist/minnty-sound-server-${{ github.ref_name }}-linux-x86_64.tar.gz" -C dist "minnty-sound-server-${{ github.ref_name }}-linux-x86_64"
      - name: Collect Linux packages
        run: |
          mkdir -p dist
          cp target/debian/*.deb "dist/minnty-sound-server-${{ github.ref_name }}-linux-x86_64.deb"
          cp target/generate-rpm/*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Download Visual C++ Redistributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "dist/vc_redist.x64.exe"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging/windows/minnty-sound-server.iss" "/DArtifactVersion=${{ github.ref_name }}" "/DRepoRoot=${{ github.workspace }}"
          Compress-Archive -Path "dist/minnty-sound-server-${{ github.ref_name }}-windows-x86_64-setup.exe" -DestinationPath "dist/minnty-sound-server-${{ github.ref_name }}-windows-x86_64-setup.zip"
          Remove-Item "dist/minnty-sound-server-${{ github.ref_name }}-windows-x86_64-setup.exe"
          Remove-Item "dist/vc_redist.x64.exe"
      - name: Package portable zip
        shell: pwsh
        run: |
          $stage = "dist/portable"
          New-Item -ItemType Directory -Force -Path $stage
          Copy-Item "target/release/minnty_sound_server.exe" $stage
          Copy-Item "README.md" $stage
          Copy-Item "LICENSE" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/minnty-sound-server-${{ github.ref_name }}-windows-x86_64-portable.zip"
          Remove-Item -Recurse -Force $stage
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*.zip

  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install base tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git wget

      - uses: actions/checkout@v5

      - name: Install build and packaging dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            desktop-file-utils \
            file \
            libdbus-1-dev \
            libgtk-3-dev \
            libpulse-dev \
            libxdo-dev \
            patchelf \
            pkg-config
          apt-get install -y libayatana-appindicator3-dev libdbusmenu-gtk3-dev || \
            apt-get install -y libappindicator3-dev libdbusmenu-gtk3-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Download AppImage tooling
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -O linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p dist AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/release/minnty_sound_server AppDir/usr/bin/
          cp packaging/minnty-sound-server.desktop AppDir/usr/share/applications/
          cp packaging/minnty-sound-server.svg AppDir/usr/share/icons/hicolor/scalable/apps/

          LIBRARY_ARGS=""
          for LIBRARY in \
            libayatana-appindicator3.so.1 \
            libayatana-ido3-0.4.so.0 \
            libdbusmenu-gtk3.so.4 \
            libdbusmenu-glib.so.4 \
            libappindicator3.so.1 \
            libindicator3.so.7
          do
            LIBRARY_PATH="$(ldconfig -p | awk -v library="${LIBRARY}" '$1 == library { print $NF; exit }')"
            if [ -n "${LIBRARY_PATH}" ]; then
              LIBRARY_ARGS="${LIBRARY_ARGS} --library ${LIBRARY_PATH}"
            fi
          done

          PATH="$PWD:$PATH" ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file packaging/minnty-sound-server.desktop \
            --icon-file packaging/minnty-sound-server.svg \
            --executable target/release/minnty_sound_server \
            ${LIBRARY_ARGS} \
            --plugin gtk \
            --output appimage
          mv Minnty_Sound_Server-x86_64.AppImage "dist/minnty-sound-server-${{ github.ref_name }}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-artifacts
          path: dist/*.AppImage

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [linux, windows, appimage]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "Minnty Sound Server ${{ github.ref_name }}" --generate-notes
          fi
