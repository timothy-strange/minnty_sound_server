[package]
name = "minnty_sound_server"
version = "0.9.3"
edition = "2024"
license = "Apache-2.0"
description = "LAN audio streaming server for Minnty clients"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.0"
bytes = "1.6"
opus = { package = "opus2", version = "0.4", default-features = false, features = ["backend-libopus", "static", "bundled"] }
mdns-sd = "0.10"
local-ip-address = "0.6"
async-trait = "0.1"
rtrb = "0.3"
tray-icon = "0.21"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
gethostname = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libpulse-binding = "2"
dbus = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"
windows = { version = "0.62", features = ["Foundation", "Media_Control"] }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
default = []
net_impairment_ui = []

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/minnty_sound_server", dest = "/usr/bin/minnty_sound_server", mode = "755" },
  { source = "packaging/minnty-sound-server.desktop", dest = "/usr/share/applications/minnty-sound-server.desktop", mode = "644" },
  { source = "packaging/minnty-sound-server.svg", dest = "/usr/share/icons/hicolor/scalable/apps/minnty-sound-server.svg", mode = "644" },
]

[package.metadata.deb]
name = "minnty-sound-server"
maintainer = "Minnty Sound Server Contributors"
copyright = "2026 Minnty Sound Server Contributors"
license-file = ["LICENSE", "0"]
depends = "$auto, libgtk-3-0, libpulse0, libdbus-1-3"
section = "sound"
priority = "optional"
assets = [
  ["target/release/minnty_sound_server", "usr/bin/minnty_sound_server", "755"],
  ["packaging/minnty-sound-server.desktop", "usr/share/applications/minnty-sound-server.desktop", "644"],
  ["packaging/minnty-sound-server.svg", "usr/share/icons/hicolor/scalable/apps/minnty-sound-server.svg", "644"],
]
