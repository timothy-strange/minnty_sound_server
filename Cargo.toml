[package]
name = "minnty_sound_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libpulse-binding = "2"
open = "5.0"
bytes = "1.6"
opus = "0.3"
mdns-sd = "0.10"
local-ip-address = "0.6"
async-trait = "0.1"
hound = "3.5"
